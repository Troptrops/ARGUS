name: Offline release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[verification]"
      - run: python -m unittest discover -s tests -v
      - run: python tools/heldout_capture.py --dry-run
      - run: argus-surface-support --help
      - run: python tools/check_release.py
